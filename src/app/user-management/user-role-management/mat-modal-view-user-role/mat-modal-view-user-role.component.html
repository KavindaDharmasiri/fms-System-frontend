<div class="mat-modal-content container-min-width">
  <div class="d-flex justify-content-between align-items-center pt-3">
    <h4 class="modal-title fw-semibold" mat-dialog-title>View User Role</h4>
    <!-- <a href="javascript:void(0)" mat-dialog-close class="close-icon">
      <i class="ph ph-x"></i>
    </a> -->
  </div>

  <mat-dialog-content>
    <div class="input-group p-1">
      <mat-label>User Role Code</mat-label>
      <mat-form-field appearance="outline" class="w-100 input-sm">
        <input matInput [(ngModel)]="userRoleCode" name="userRoleCode" disabled>
      </mat-form-field>
    </div>

    <div class="input-group p-1">
      <mat-label>User Role Name</mat-label>
      <mat-form-field appearance="outline" class="w-100 input-sm">
        <input matInput [(ngModel)]="userRoleName" name="userRoleName" disabled>
      </mat-form-field>
    </div>

    <div class="input-group p-1">
      <mat-label>Created Date</mat-label>
      <mat-form-field appearance="outline" class="w-100 input-sm">
        <input matInput [(ngModel)]="createdDate" name="createdDate" disabled>
      </mat-form-field>
    </div>

    <div class="input-group p-1">
      <mat-label>Last Modified Date</mat-label>
      <mat-form-field appearance="outline" class="w-100 input-sm">
        <input matInput [(ngModel)]="lastModifiedDate" name="lastModifiedDate" disabled>
      </mat-form-field>
    </div>

    <div class="status-toggle p-1">
      <mat-slide-toggle [(ngModel)]="status" name="status" disabled>Status</mat-slide-toggle>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <div class="d-flex p-2 justify-content-between w-100">
      <button class="btn btn-default" mat-dialog-close>Cancel</button>
    </div>
  </mat-dialog-actions>
</div>

<div class="main-container">
  <div class="d-flex justify-content-between align-items-center">
    <div class="breadcrumb-container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb custom-breadcrumb d-flex align-items-center">
          <li class="breadcrumb-item active" aria-current="page">
            <span id="active-iphone-breadcrumb">AI Rule Generation</span>
          </li>
        </ol>
      </nav>
    </div>
  </div>
  <div class="sub-container">
    <div class="text-center py-5">
      <div class="speedometer-container mb-4" (click)="generateFutureRules()" [style.cursor]="isGenerating ? 'not-allowed' : 'pointer'">
        <svg width="300" height="180" viewBox="0 0 300 180">
          <path d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke="#e0e0e0" stroke-width="30" stroke-linecap="round"/>
          <path d="M 30 150 A 120 120 0 0 1 270 150" fill="none" [attr.stroke]="speedometerValue > 70 ? '#4caf50' : speedometerValue > 40 ? '#ff9800' : '#2196f3'" stroke-width="30" stroke-linecap="round" [attr.stroke-dasharray]="(speedometerValue * 3.77) + ' 377'" class="speedometer-progress"/>
          <text x="150" y="135" text-anchor="middle" font-size="36" font-weight="bold">{{speedometerValue | number:'1.0-0'}}%</text>
        </svg>
        <p class="text-muted mt-3" style="font-size: 18px;">{{isGenerating ? 'Generating AI Rules...' : 'Ready'}}</p>
      </div>
      <div *ngIf="generatedRules" class="mt-4">
        <h6 class="fw-semibold mb-3">Generated Rules ({{rulesArray.length}})</h6>
        <div class="resizable-panel">
          <div class="rules-container" #rulesContainer>
            <div class="rule-card" *ngFor="let rule of rulesArray; let i = index">
              <div class="rule-header">Rule {{i + 1}}</div>
              <pre class="rule-content">{{rule}}</pre>
            </div>
          </div>
          <div class="resize-handle" (mousedown)="startResize($event)"></div>
        </div>
        <button class="btn btn-primary mt-3" (click)="deployRules()" [disabled]="isDeploying">
          <i class="ph ph-rocket-launch"></i> {{isDeploying ? 'Deploying...' : 'Deploy AI Rules'}}
        </button>
      </div>
    </div>
  </div>
</div>

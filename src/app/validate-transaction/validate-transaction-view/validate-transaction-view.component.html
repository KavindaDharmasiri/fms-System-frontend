<div class="mat-modal-content container-min-width">
  <div class="d-flex justify-content-between align-items-center pt-3">
    <h4 class="modal-title fw-semibold" mat-dialog-title>View Validate Transaction</h4>
    <!-- <a href="javascript:void(0)" mat-dialog-close class="close-icon">
      <i class="ph ph-x"></i>
    </a> -->
  </div>

  <mat-dialog-content>
    <div class="input-group p-1">
      <mat-label>Validate Transaction ID</mat-label>
      <mat-form-field appearance="outline" class="w-100 input-sm">
        <input matInput [(ngModel)]="validateTransactionID" name="userRoleCode" disabled>
      </mat-form-field>
    </div>

    <div class="input-group p-1">
      <mat-label>Error Message List</mat-label>
      <mat-form-field appearance="outline" class="w-100 input-sm" *ngIf="errorMessageList.length === 0">
        <input matInput value="No errors" disabled>
      </mat-form-field>

      <ul *ngIf="errorMessageList.length > 0" class="p-2">
        <li *ngFor="let msg of errorMessageList">{{ msg }}</li>
      </ul>
    </div>


    <div class="input-group p-1">
      <mat-label>Transaction date & Time</mat-label>
      <mat-form-field appearance="outline" class="w-100 input-sm">
        <input matInput [(ngModel)]="TransactionDateTime" name="createdDate" disabled>
      </mat-form-field>
    </div>

    <div class="status-toggle p-1">
      <mat-slide-toggle [(ngModel)]="isValid" name="status" disabled>Is Valid</mat-slide-toggle>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <div class="d-flex p-2 justify-content-between w-100">
      <button class="btn btn-default" mat-dialog-close>Cancel</button>
    </div>
  </mat-dialog-actions>
</div>

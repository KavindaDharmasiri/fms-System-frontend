<div class="main-container">
  <div class="sub-container">
    <div class="row g-4">
      <div>
        <span class="fw-semibold font-16px">Chart</span>
      </div>

      <div class="col-md-6">
        <h5>Bar Chart</h5>
        <div baseChart class="d-block">
          <canvas id="bar"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <h5>Line Chart</h5>
        <canvas
          baseChart
          class="chart"
          [data]="lineChartData"
          [options]="lineChartOptions"
          [type]="lineChartType"
        ></canvas>
      </div>

      <div class="col-md-6">
        <h5>Doughnut Chart</h5>
        <div baseChart class="d-block w-75">
          <canvas id="donutChart"> </canvas>
        </div>
      </div>
      <div class="col-md-6">
        <h5>Pie Chart</h5>
        <div baseChart class="d-block w-75">
          <canvas
            baseChart
            [data]="pieChartData"
            [type]="pieChartType"
            [options]="pieChartOptions"
            [plugins]="pieChartPlugins"
          >
          </canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="main-container">
  <div class="sub-container">
    <span class="fw-semibold font-16px">Buttons</span>

    <div class="d-column gap-3">
      <div class="col-md-12">
        <p class="text-red">
          Note: btn class should be added for every button.
        </p>
        <button class="btn btn-primary">
          <i class="ph ph-house"></i> Example
        </button>
      </div>

      <div class="d-flex flex-wrap gap-3">
        <div class="col-12">
          <h5 class="m-0">Button Variations</h5>
        </div>
        <div class="flex-1">
          <button class="btn btn-primary">Primary</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-secondary">Secondary</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-assent">Assent</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-black">Black</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-info">Info</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-success">Success</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-warning">Warning</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-danger">Danger</button>
        </div>

        <div class="flex-1">
          <button class="btn btn-primary btn-light">
            <i class="ph ph-house"></i>
          </button>
        </div>
        <div class="flex-1">
          <button class="btn btn-primary">
            Payment
            <img src="../../../assets/img/payments/Visa.png" alt="" />
          </button>
        </div>
        <div class="flex-1">
          <button class="btn btn-text-only font-weight-600 text-informative-500">
            Default Close / Cancel button
          </button>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-3">
        <div class="col-12">
          <h5 class="m-0">Button Type</h5>
        </div>
        <div class="flex-1">
          <button class="btn btn-default">
            Default <i class="ph ph-house"></i>
          </button>
        </div>
        <div class="flex-1">
          <button class="btn btn-primary btn-outline">Outline</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-primary" disabled>Disabled</button>
        </div>
        <div class="flex-1">
          <button class="btn btn-text-only font-weight-500 text-primary-500">
            Text Button
          </button>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-3">
        <div class="col-12">
          <h5 class="m-0">Button Sizes</h5>
        </div>
        <div class="flex-1">
          <button class="btn btn-primary btn-sm">
            Small<i class="ph-house"></i>
          </button>
        </div>
        <div class="flex-1">
          <button class="btn btn-primary">
            Defult <i class="ph-house"></i>
          </button>
        </div>
        <div class="flex-1">
          <button class="btn btn-primary btn-lg">
            Large <i class="ph-house font-24px"></i>
          </button>
        </div>
        <div class="col-md-12">
          <p class="text-red">
            Width can be changed in multiples of 5 ( Example - w-5 | w-10 | w-15
            | w-50 )
          </p>
          <button class="btn btn-primary w-50">Example</button>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-3">
        <div class="col-12">
          <h5 class="m-0">Button Group</h5>
        </div>
        <div class="col-md-3">
          <div class="btn-group btn-group-sm" role="group" aria-label="Basic outlined example">
            <button type="button" class="btn btn-secondary btn-outline">
              <i class="ph ph-eye"></i>
            </button>
            <button type="button" class="btn btn-secondary btn-outline">
              <i class="ph ph-note-pencil"></i>
            </button>
            <button type="button" class="btn btn-secondary btn-outline">
              <i class="ph ph-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

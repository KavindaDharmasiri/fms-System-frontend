<div class="mat-modal-content container-min-width">
  <div class="d-flex justify-content-between align-items-center pt-3">
    <div>
      <h3 class="" mat-dialog-title>Rule Name</h3>
    </div>
    <a href="javascript:void(0)" mat-dialog-close class="">
      <i class="ph ph-x"></i>
    </a>
  </div>
  <mat-dialog-content>

    <div class="row g-2">
      <div class="operator-btn-group pt-2 ">
        <div class="d-flex justify-content-between">
          <h6>Transaction History List</h6>
          <div class="d-flex justify-content-end gap-2">
            <div class="flex-1 flex-end">
              <button class="badge bg-green">Success</button>
            </div>
          </div>
        </div>
        <!--        <h6>Transaction History List</h6>-->
        <!--        <div class="flex-1 flex-end">-->
        <!--          <button class="badge bg-green">Success</button>-->
        <!--        </div>-->
      </div>

    </div>

    <div class="row g-2">
      <div class="col-md-4">
        <mat-label>Status</mat-label>
        <mat-form-field appearance="outline" class="w-100">
          <mat-select multiple placeholder="Select">
            <mat-option value="option1">Option 1</mat-option>
            <mat-option value="option2">Option 2</mat-option>
            <mat-option value="option3">Option 3</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-4">
        <mat-label>From</mat-label>
        <div class="d-flex align-items-center border rounded mt-2">
          <input
            matInput
            [matDatepicker]="picker1"
            placeholder="DD/MM/YYYY"
            class="form-control border-0 flex-grow-1 date-size"
            style="outline: none; box-shadow: none"
          />

          <span class="cursor mx-2 mt-1" (click)="picker1.open()">
              <i class="ph ph-calendar fs-4"></i>
              </span>

          <mat-datepicker class="input-sm" #picker1></mat-datepicker>
        </div>
      </div>
      <div class="col-md-4">
        <mat-label>To</mat-label>
        <div class="d-flex align-items-center border rounded mt-2">
          <input
            matInput
            [matDatepicker]="picker1"
            placeholder="DD/MM/YYYY"
            class="form-control border-0 flex-grow-1 date-size"
            style="outline: none; box-shadow: none"
          />

          <span class="cursor mx-2 mt-1" (click)="picker1.open()">
              <i class="ph ph-calendar fs-4"></i>
              </span>

          <mat-datepicker class="input-sm" #picker1></mat-datepicker>
        </div>
      </div>
    </div>

  </mat-dialog-content>
  <hr>

  <div class="table-container mt-3">
    <div class="scrollable-table-container">
      <div class="mat-table">
        <table mat-table [dataSource]="dataSource">
          <ng-container matColumnDef="Transaction">
            <th mat-header-cell *matHeaderCellDef>Transaction</th>
            <td mat-cell *matCellDef="let element">
              {{ element.id }}</td>
          </ng-container>
          <ng-container matColumnDef="TimeStamp">
            <th mat-header-cell *matHeaderCellDef>TimeStamp</th>
            <td mat-cell *matCellDef="let element">
              {{ element.TimeStamp }}</td>
          </ng-container>
          <ng-container matColumnDef="Card Number">
            <th mat-header-cell *matHeaderCellDef>Card Number</th>
            <td mat-cell *matCellDef="let element">
              {{ element.card_number }}
            </td>
          </ng-container>
          <ng-container matColumnDef="Amount(LKR)">
            <th mat-header-cell *matHeaderCellDef>Amount(LKR)</th>
            <td mat-cell *matCellDef="let element">
              {{ element.amount }}
            </td>
          </ng-container>
          <ng-container matColumnDef="Status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let element">
              <span
                class="badge ms-5 me-5"
                [ngClass]="{
                      'bg-green': element.status == true,
                      'bg-red': element.status == false,
                    }">
                    {{ element.status == true ? 'Executed' : 'Nonexecuted' }}
                </span>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
      <hr>

    </div>

  </div>



</div>

<header class="border-bottom nav-bar">
  <div class="container-fluid px-3">
    <div class="d-flex justify-content-between align-items-center main-header">
      <div class="d-flex align-items-center">
        <!-- <i class="ph ph-user-circle-gear fs-4 me-2"></i> -->
        <span class="fw-bold font-18px">{{ pageTitle }}</span>
      </div>

      <div class="d-flex align-items-center gap-3">
        <!-- Notification Bell -->
        <div
          class="d-flex justify-content-between align-items-center gap-1 header-icon"
          data-bs-toggle="offcanvas"
          data-bs-target="#notificationPanel"
        >
          <i class="ph ph-bell-simple header-icon"></i>
          <span class="badge rounded-pill text-bg-danger badge-sm">12</span>
        </div>

        <!-- User Profile Dropdown -->
        <div class="dropdown userDropdown">
          <div
            class="d-flex align-items-center gap-2 dropdown-toggle"
            id="userDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <!-- User Info -->
            <div class="d-flex flex-column me-2">
              <span class="fw-medium font-14px">{{ getUserName() }}</span>
              <span class="text-muted font-12px">Administrator</span>
            </div>

            <!-- Dropdown Arrow -->
            <i class="ph ph-caret-down"></i>
          </div>

          <!-- Dropdown Menu -->
          <ul
            class="dropdown-menu dropdown-menu-end shadow-sm"
            aria-labelledby="userDropdown"
          >
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="#">
                <i class="ph ph-gear"></i>
                Settings
              </a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="#">
                <i class="ph ph-sign-out"></i>
                Sign Out
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Notification Offcanvas -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="notificationPanel">
  <div class="offcanvas-header notification-header">
    <div class="d-flex align-items-center gap-2">
      <span class="offcanvas-title font-18px fw-semibold">Notifications</span>
      <span class="badge badge-primary badge-outline badge-sm">10</span>
    </div>

    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
    ></button>
  </div>
  <div class="offcanvas-body p-0">
    <!-- Notification Item 1 -->
    <div class="notification-item">
      <div class="d-flex flex-column">
        <div class="d-flex align-items-center">
          <span class="font-14px fw-semibold me-2"
            >New applicant registration</span
          >
          <span class="badge badge-info badge-outline badge-sm">Success</span>
        </div>
        <span class="notification-time text-neutral-400 font-12px"
          >2 hours ago</span
        >
      </div>
    </div>

    <!-- Notification Item 2 -->
    <div class="notification-item">
      <div class="d-flex flex-column">
        <div class="d-flex align-items-center">
          <span class="font-14px fw-semibold me-2"
            >New applicant registration</span
          >
          <span class="badge bg-red badge-outline badge-sm">Failed</span>
        </div>
        <span class="notification-time text-neutral-400 font-12px"
          >3 hours ago</span
        >
      </div>
    </div>
  </div>
</div>

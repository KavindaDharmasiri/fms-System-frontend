            <div class="text-center">
              <p class="fw-bold">Reset Password</p>
            </div>
          </div>
          <div class="w-100">
            <form class="form-horizontal" autocomplete="off" method="post">
              <div class="contant">
                <div class="flex-grow-1 me-2">
                  <mat-label>Current Password</mat-label>
                  <mat-form-field appearance="outline" class="w-100 input-sm ">
                    <input type="password" matInput placeholder="*****" maxlength="50" required />
                  </mat-form-field>
                </div>

                <div class="flex-grow-1 me-2">
                  <mat-label>New Password</mat-label>
                  <mat-form-field appearance="outline" class="w-100 input-sm ">
                    <input type="password" matInput placeholder="*****" maxlength="50" required />
                  </mat-form-field>
                </div>

                <div class="flex-grow-1 me-2">
                  <mat-label>Confirm Password</mat-label>
                  <mat-form-field appearance="outline" class="w-100 input-sm ">
                    <input type="password" matInput placeholder="*****" maxlength="50" required />
                  </mat-form-field>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </mat-dialog-content>
    <mat-dialog-actions>
      <div class="d-flex justify-content-between gap-2 w-100">
        <button class="btn  btn-default" mat-dialog-close>Cancel</button>
        <button class="btn  btn-primary" [mat-dialog-close]="true" cdkFocusInitial><i
            class="ph ph-arrow-clockwise"></i>Reset Password</button>
      </div>
    </mat-dialog-actions>
  </div>
</div>
